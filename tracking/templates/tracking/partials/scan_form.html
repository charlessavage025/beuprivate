<div class="card" id="scan-card">
    <h1>Manual scan</h1>
    {% if success %}
        <div class="success-msg">Scan recorded successfully.</div>
    {% endif %}
    {% if form.non_field_errors %}
        <div class="error-msg">{{ form.non_field_errors }}</div>
    {% endif %}
    <form hx-post="{% url 'staff_scan' %}" hx-target="#scan-card" hx-swap="outerHTML">
        {% csrf_token %}
        {% for field in form %}
            <div class="field">
                <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<span class="error-msg">{{ field.errors }}</span>{% endif %}
            </div>
        {% endfor %}
        <button class="btn" type="submit">Record scan</button>
    </form>
</div>
