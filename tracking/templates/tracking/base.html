<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Bureau Private Delivery Company{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --purple: #111111;
            --purple-dark: #000000;
            --purple-tint: #fdece6;
            --orange: #ff3b18;
            --orange-dark: #d42d0e;
            --gold: #f7c948;

            --ink: #171513;
            --gray-900: #201d1a;
            --gray-700: #58524b;
            --gray-500: #837c74;
            --gray-300: #e2ddd6;
            --gray-200: #ece7e1;
            --gray-100: #f7f5f2;
            --white: #ffffff;

            --success: #0b7a3b;
            --success-bg: #e7f6ec;
            --warning: #b45309;
            --warning-bg: #fdf1e0;
            --danger: #b3261e;
            --danger-bg: #fbeae9;

            --radius-sm: 6px;
            --radius: 10px;
            --radius-lg: 14px;
            --shadow-sm: 0 1px 2px rgba(15, 12, 10, 0.06);
            --shadow-md: 0 8px 24px -8px rgba(15, 12, 10, 0.18);
            --border: var(--gray-200);
            --bg: var(--gray-100);
            --card: var(--white);
            --text: var(--gray-900);
            --muted: var(--gray-500);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --purple-tint: #241d18;
                --ink: #f2f0ed;
                --gray-900: #f2f0ed;
                --gray-700: #c9c4bf;
                --gray-500: #948e88;
                --gray-300: #3a3532;
                --gray-200: #2a2623;
                --gray-100: #171513;
                --white: #201c1a;
                --success-bg: #10301d;
                --warning-bg: #3a2408;
                --danger-bg: #3a1614;
                --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
                --shadow-md: 0 8px 24px -8px rgba(0, 0, 0, 0.5);
            }
        }

        * { box-sizing: border-box; }
        html { -webkit-font-smoothing: antialiased; }
        body {
            font-family: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            line-height: 1.5;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        a { color: inherit; }
        h1, h2, h3 { font-weight: 700; letter-spacing: -0.01em; margin: 0 0 0.75rem; }
        h1 { font-size: 1.5rem; }
        h2 { font-size: 1.125rem; }
        h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--gray-700); }
        svg.icon { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 1.85; stroke-linecap: round; stroke-linejoin: round; vertical-align: -0.14em; flex-shrink: 0; }

        .sr-only {
            position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
            overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
        }

        /* ---- Site nav: its own bar above the page, same palette everywhere ---- */
        .uthao-nav {
            position: relative;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            column-gap: 1rem;
            background: var(--purple);
            border-bottom: 3px solid var(--orange);
            padding: 0 1.25rem;
            height: 60px;
        }
        .uthao-nav-logo {
            justify-self: start;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            white-space: nowrap;
            text-decoration: none;
        }
        .uthao-logo-mark {
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            width: 30px; height: 30px;
            border-radius: 8px;
            background: var(--orange);
            color: #fff;
            font-weight: 800;
            font-size: 0.95rem;
            letter-spacing: 0;
        }
        .uthao-logo-text {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }
        .uthao-logo-name {
            color: #fff;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 0.02em;
        }
        .uthao-logo-tag {
            margin-top: 3px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
            font-size: 0.58rem;
            letter-spacing: 0.09em;
            text-transform: uppercase;
        }
        .uthao-nav-links {
            grid-column: 2;
            justify-self: center;
            display: none;
            align-items: center; gap: 2.5rem;
        }
        .uthao-nav-links a {
            color: rgba(255, 255, 255, 0.78);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            letter-spacing: 0.01em;
            transition: color 0.15s ease;
        }
        .uthao-nav-links a:hover { color: #fff; }

        .uthao-nav-mobile { grid-column: 3; justify-self: end; position: relative; }
        .uthao-nav-burger {
            list-style: none;
            display: flex; align-items: center; justify-content: center;
            width: 2.4rem; height: 2.4rem;
            border-radius: 50%;
            color: #fff;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .uthao-nav-burger:hover { background: rgba(255, 255, 255, 0.1); }
        .uthao-nav-burger::-webkit-details-marker { display: none; }
        .uthao-nav-burger::marker { content: ""; }
        .uthao-nav-burger .icon { width: 20px; height: 20px; }
        .uthao-icon-close { display: none; }
        .uthao-nav-mobile[open] .uthao-nav-burger { background: rgba(255, 255, 255, 0.1); }
        .uthao-nav-mobile[open] .uthao-icon-open { display: none; }
        .uthao-nav-mobile[open] .uthao-icon-close { display: block; }

        .uthao-nav-mobile-panel {
            position: absolute; top: calc(100% + 0.75rem); right: 0;
            display: flex; flex-direction: column;
            min-width: 168px;
            background: var(--purple-dark);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            padding: 0.4rem;
            box-shadow: 0 14px 32px -12px rgba(0, 0, 0, 0.6);
            z-index: 5;
        }
        .uthao-nav-mobile-panel a {
            color: rgba(255, 255, 255, 0.88);
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            padding: 0.7rem 0.85rem;
            border-radius: 9px;
        }
        .uthao-nav-mobile-panel a + a { margin-top: 2px; }
        .uthao-nav-mobile-panel a:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }

        @media (min-width: 640px) {
            .uthao-nav-links { display: flex; }
            .uthao-nav-mobile { display: none; }
        }
        @media (min-width: 900px) {
            .uthao-nav { padding: 0 1.75rem; height: 68px; }
        }

        /* ---- Footer ---- */
        .uthao-footer {
            background: var(--purple);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            padding: 1.5rem 1.25rem;
            margin-top: auto;
            text-align: center;
        }
        .uthao-footer-copy {
            margin: 0;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
        }

        main { max-width: 980px; margin: 0 auto; padding: 2rem 1.5rem 3rem; flex: 1; width: 100%; }
        main.main-full { max-width: none; margin: 0; padding: 0; }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow-sm);
        }

        .btn {
            display: inline-flex; align-items: center; gap: 0.45rem;
            background: var(--purple);
            color: #fff;
            border: 1px solid var(--purple);
            border-radius: var(--radius-sm);
            padding: 0.6rem 1.1rem;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
        }
        .btn:hover { background: var(--purple-dark); border-color: var(--purple-dark); }
        .btn:active { transform: translateY(1px); }
        .btn.accent { background: var(--orange); border-color: var(--orange); }
        .btn.accent:hover { background: var(--orange-dark); border-color: var(--orange-dark); }
        .btn.secondary { background: transparent; color: var(--gray-900); border-color: var(--gray-300); }
        .btn.secondary:hover { background: var(--gray-100); border-color: var(--gray-500); }
        .btn.warning { background: transparent; color: var(--warning); border-color: var(--warning); }
        .btn.warning:hover { background: var(--warning-bg); }
        .btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
        .btn.danger:hover { background: var(--danger-bg); }
        .btn.small { padding: 0.4rem 0.75rem; font-size: 0.8rem; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
        .row-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; }

        input, select, textarea {
            padding: 0.6rem 0.7rem;
            border: 1px solid var(--gray-300);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-family: inherit;
            background: var(--card);
            color: var(--text);
            width: 100%;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        input:focus, select:focus, textarea:focus {
            outline: none; border-color: var(--orange);
            box-shadow: 0 0 0 3px rgba(255, 59, 24, 0.15);
        }
        textarea { resize: vertical; }

        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -1px; }
        table { width: 100%; min-width: 640px; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.65rem 0.7rem; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
        th { color: var(--gray-500); font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.04em; }
        tbody tr:hover { background: var(--gray-100); }
        tbody tr:last-child td { border-bottom: none; }

        .badge {
            display: inline-flex; align-items: center; gap: 0.35rem;
            padding: 0.3rem 0.7rem;
            border-radius: 999px;
            font-size: 0.76rem;
            font-weight: 700;
            letter-spacing: 0.01em;
            background: rgba(255, 59, 24, 0.12);
            color: var(--orange);
        }
        .badge.delivered { background: var(--success-bg); color: var(--success); }
        .badge.delayed { background: var(--warning-bg); color: var(--warning); }

        .muted { color: var(--muted); }
        .messages { list-style: none; padding: 0; }
        .messages li { padding: 0.65rem 0.9rem; border-radius: var(--radius-sm); background: var(--success-bg); color: var(--success); margin-bottom: 0.5rem; font-size: 0.88rem; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .field { margin-bottom: 0.9rem; display: flex; flex-direction: column; gap: 0.3rem; }
        .field[hidden] { display: none; }
        .field label { font-size: 0.8rem; font-weight: 600; color: var(--gray-700); }
        .field .muted { font-size: 0.78rem; }
        .filters { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
        .filters a { text-decoration: none; }
        .success-msg { display: flex; align-items: center; gap: 0.5rem; background: var(--success-bg); color: var(--success); padding: 0.7rem 0.9rem; border-radius: var(--radius-sm); margin-bottom: 1rem; font-size: 0.88rem; font-weight: 600; }
        .error-msg { display: flex; align-items: center; gap: 0.5rem; background: var(--danger-bg); color: var(--danger); padding: 0.7rem 0.9rem; border-radius: var(--radius-sm); margin-bottom: 1rem; font-size: 0.88rem; font-weight: 600; }

        @media (max-width: 640px) {
            .grid-2 { grid-template-columns: 1fr; }
            main { padding: 1.25rem 1rem 2rem; }
            .card { padding: 1.1rem; }
        }

        /* ---- Date/time picker modal, shared across pages ---- */
        dialog.dt-modal {
            border: none;
            padding: 0;
            width: 100%;
            max-width: 340px;
            background: var(--card);
            color: var(--text);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-md);
        }
        dialog.dt-modal::backdrop { background: rgba(15, 12, 10, 0.5); }
        .dt-modal-form { padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .dt-modal-form h3 { margin: 0; text-transform: none; letter-spacing: normal; font-size: 1.05rem; color: var(--text); }
        .dt-modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.25rem; }
    </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' class="{% block body_class %}{% endblock %}">
    {% block header %}
    <header class="uthao-nav">
        <a class="uthao-nav-logo" href="{% url 'index' %}" aria-label="Bureau Private Delivery Company — home">
            <span class="uthao-logo-mark" aria-hidden="true">B</span>
            <span class="uthao-logo-text">
                <span class="uthao-logo-name">Bureau</span>
                <span class="uthao-logo-tag">Private Delivery</span>
            </span>
        </a>

        <nav class="uthao-nav-links" aria-label="Primary">
            <a href="{% url 'index' %}">Home</a>
            <a href="{% url 'index' %}#track">Track</a>
        </nav>

        <details class="uthao-nav-mobile">
            <summary class="uthao-nav-burger" aria-label="Open menu">
                <svg class="icon uthao-icon-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                <svg class="icon uthao-icon-close" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
            </summary>
            <div class="uthao-nav-mobile-panel">
                <a href="{% url 'index' %}">Home</a>
                <a href="{% url 'index' %}#track">Track</a>
            </div>
        </details>
    </header>
    {% endblock %}
    <main class="{% block main_class %}{% endblock %}">
        {% block content %}{% endblock %}
    </main>
    {% block footer %}
    <footer class="uthao-footer">
        <p class="uthao-footer-copy">&copy; {% now "Y" %} Bureau Private Delivery Company. All rights reserved.</p>
    </footer>
    {% endblock %}

    <dialog id="dt-modal" class="dt-modal">
        <form id="dt-modal-form" class="dt-modal-form">
            <h3 id="dt-modal-title">Set date &amp; time</h3>
            <div class="field">
                <label for="dt-modal-input">Date &amp; time</label>
                <input type="datetime-local" id="dt-modal-input" required>
            </div>
            <div class="field" id="dt-modal-reason-field" hidden>
                <label for="dt-modal-reason">Reason</label>
                <textarea id="dt-modal-reason" rows="2" placeholder="What's the reason for this delay?"></textarea>
            </div>
            <div class="dt-modal-actions">
                <button type="button" class="btn secondary" id="dt-modal-cancel">Cancel</button>
                <button type="submit" class="btn accent">Confirm</button>
            </div>
        </form>
    </dialog>
    <script>
        (function () {
            var modal = document.getElementById("dt-modal");
            var form = document.getElementById("dt-modal-form");
            var input = document.getElementById("dt-modal-input");
            var reasonField = document.getElementById("dt-modal-reason-field");
            var reasonInput = document.getElementById("dt-modal-reason");
            var titleEl = document.getElementById("dt-modal-title");
            var cancelBtn = document.getElementById("dt-modal-cancel");
            var onConfirm = null;

            function pad(n) { return String(n).padStart(2, "0"); }

            function nowLocalValue() {
                var d = new Date();
                return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
                    + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
            }

            // options: { title, defaultValue, showReason, defaultReason, onConfirm({value, reason}) }
            window.openDateTimeModal = function (options) {
                options = options || {};
                titleEl.textContent = options.title || "Set date & time";
                input.value = options.defaultValue || nowLocalValue();
                if (options.showReason) {
                    reasonField.hidden = false;
                    reasonInput.value = options.defaultReason || "";
                } else {
                    reasonField.hidden = true;
                    reasonInput.value = "";
                }
                onConfirm = options.onConfirm || null;
                if (typeof modal.showModal === "function") {
                    modal.showModal();
                } else {
                    modal.setAttribute("open", "open");
                }
                input.focus();
            };

            cancelBtn.addEventListener("click", function () {
                onConfirm = null;
                modal.close();
            });

            form.addEventListener("submit", function (evt) {
                evt.preventDefault();
                var callback = onConfirm;
                onConfirm = null;
                modal.close();
                if (callback) {
                    callback({ value: input.value, reason: reasonInput.value });
                }
            });

            // Any hx-* trigger carrying data-dt-modal pauses its request,
            // collects a date/time (and optional reason) in the modal, then
            // resumes the request with those values added. htmx:confirm's
            // detail has no "parameters" to write to, so the picked values
            // are stashed here and merged in on htmx:configRequest instead,
            // which fires right as the (now-resumed) request is built.
            var dtPendingValues = new WeakMap();

            document.body.addEventListener("htmx:confirm", function (evt) {
                var trigger = evt.detail.elt;
                if (!trigger || !trigger.hasAttribute("data-dt-modal")) return;
                evt.preventDefault();
                var showReason = trigger.hasAttribute("data-dt-reason");
                openDateTimeModal({
                    title: trigger.getAttribute("data-dt-title") || "Set date & time",
                    showReason: showReason,
                    onConfirm: function (result) {
                        dtPendingValues.set(trigger, {
                            timestamp: result.value,
                            reason: showReason ? result.reason : undefined
                        });
                        evt.detail.issueRequest(true);
                    }
                });
            });

            document.body.addEventListener("htmx:configRequest", function (evt) {
                var trigger = evt.detail.elt;
                var values = trigger && dtPendingValues.get(trigger);
                if (!values) return;
                dtPendingValues.delete(trigger);
                evt.detail.parameters.timestamp = values.timestamp;
                if (values.reason !== undefined) {
                    evt.detail.parameters.reason = values.reason;
                }
            });
        })();
    </script>
</body>
</html>
