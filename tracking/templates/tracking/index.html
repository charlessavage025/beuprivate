{% extends "tracking/base.html" %}
{% block title %}SwiftTrack — Track your shipment{% endblock %}
{% block content %}
<div class="hero">
    <h1 class="hero-title">Track your shipment</h1>
    <p class="hero-sub">Enter the 12-digit tracking number from your shipping label.</p>
    <form class="hero-search" hx-get="{% url 'track_search' %}" hx-target="#result" hx-swap="innerHTML">
        <input type="text" id="tracking_number" name="tracking_number" placeholder="e.g. 123456789012" autocomplete="off" required>
        <button class="btn accent" type="submit">Track</button>
    </form>
    {% if error %}
        <div class="error-msg hero-error">{{ error }}</div>
    {% endif %}
</div>
<div id="result"></div>

<style>
    .hero {
        background: var(--purple);
        border-radius: var(--radius-lg);
        padding: 2.75rem 2rem;
        margin-bottom: 1.5rem;
        color: #fff;
        text-align: center;
        box-shadow: var(--shadow-md);
    }
    .hero-title { color: #fff; font-size: 1.75rem; margin-bottom: 0.4rem; }
    .hero-sub { color: rgba(255,255,255,0.78); margin: 0 0 1.75rem; font-size: 0.92rem; }
    .hero-search {
        display: flex; align-items: center; gap: 0.5rem;
        background: #fff; border-radius: 999px;
        padding: 0.35rem 0.35rem 0.35rem 1.1rem;
        max-width: 520px; margin: 0 auto;
        box-shadow: 0 12px 28px -10px rgba(20, 10, 45, 0.45);
    }
    .hero-search input {
        flex: 1; min-width: 0;
        border: none; padding: 0.55rem 0.25rem; font-size: 0.95rem;
        background: transparent;
    }
    .hero-search input:focus { box-shadow: none; }
    .hero-search .btn { border-radius: 999px; padding: 0.6rem 1.3rem; }
    .hero-error { max-width: 520px; margin: 1.25rem auto 0; text-align: left; }
    @media (max-width: 640px) {
        .hero-search { flex-wrap: wrap; border-radius: var(--radius); padding: 0.6rem; }
        .hero-search input { width: 100%; order: 1; }
        .hero-search .btn { width: 100%; order: 2; justify-content: center; }
    }
</style>
{% endblock %}
